plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.dmitry.schedulewidget'
    compileSdk 35

    defaultConfig {
        applicationId "com.dmitry.schedulewidget"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
