yaml
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          tag_name: release
          name: "Актуальное расписание (Релиз)"
          body: "Свежая версия виджета с поддержкой каникул, распознавания скриншотов и редактирования."
          draft: false
          prerelease: false
          make_latest: true
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
